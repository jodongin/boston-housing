<style>
:root{--bg:#f6f6f3;--card:#fff;--ink:#1c1d1f;--mute:#6b7075;--line:#e4e4df;--soft:#f1f1ec;

*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:14px/1.5 -apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:var(--ink);background:var(--bg)}
a{color:var(--c);text-decoration:none}a:hover{text-decoration:underline}

 .top .upd,.who .lbl{display:none}

}

const list=document.getElementById("list");
function copyAsk(n,id,btn){const x=(ASKS[n]||[]).find(a=>a.id===id);if(!x)return;const txt=`[${n}] ${x.q}\n추천: ${x.rec||"-"}\n(질문 ID: ${x.id})\n내 답: `;
 const done=()=>{btn.textContent="복사됨";btn.classList.add("ok");setTimeout(()=>{btn.textContent="질문 복사";btn.classList.remove("ok")},1500)};
 function fb(){const ta=document.createElement("textarea");ta.value=txt;document.body.appendChild(ta);ta.select();try{document.execCommand("copy")}catch(e){}ta.remove();done()}
 if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(txt).then(done,fb);else fb()}
list.addEventListener("click",e=>{const cpb=e.target.closest(".cp");if(cpb){e.stopPropagation();e.preventDefault();copyAsk(cpb.dataset.cpn,cpb.dataset.cpi,cpb);return}const s=e.target.closest(".st");if(s){e.stopPropagation();setStar(s.dataset.n,s.dataset.p,+s.dataset.v);render(true);return}
 const card=e.target.closest(".card");if(!card)return;const n=card.dataset.n,r=L.find(x=>x.n===n);
 const pt=e.target.closest("[data-pt]");if(pt){PT[n]=pt.dataset.pt;render(true);return}
 const cl=e.target.closest("[data-cl]");if(cl){UI.clang=cl.dataset.cl;render(true);return}
 const a=e.target.closest("[data-a]");if(a){const k=a.dataset.a;if(k==="ex"){setEx(n,true);render(true)}else if(k==="unex"){setEx(n,false);render(true)}else if(k==="savememo"){setNote(n,card.querySelector("textarea").value);render(true)}return}
 if(e.target.closest(".panel")||e.target.closest("a"))return;
 SEL=SEL===n?null:n;render(true);if(SEL&&r&&r.geo){const m=MK[n];if(!M.getBounds().contains(m.getLatLng()))M.panTo(m.getLatLng());m.openPopup()}});
list.addEventListener("keydown",e=>{if(e.target.matches("textarea.nte")&&(e.metaKey||e.ctrlKey)&&e.key==="Enter"){const c=e.target.closest(".card");setNote(c.dataset.n,e.target.value);render(true)}});
list.addEventListener("mouseover",e=>{const c=e.target.closest(".card");hl(c?c.dataset.n:null)});
list.addEventListener("mouseleave",()=>hl(null));
document.getElementById("tabs").onclick=e=>{const b=e.target.closest("[data-tab]");if(!b)return;UI.tab=b.dataset.tab;SEL=null;render();list.scrollTop=0};
const q=document.getElementById("q");q.value=UI.q;q.oninput=()=>{UI.q=q.value;render()};
const so=document.getElementById("sort");so.value=UI.sort;so.onchange=()=>{UI.sort=so.value;render()};
document.getElementById("fbtn").onclick=()=>{document.getElementById("fp").classList.toggle("show");document.getElementById("fbtn").classList.toggle("on")};
["f3000","fpark","fwd","frated"].forEach(id=>{const el=document.getElementById(id);el.checked=UI[id];el.onchange=()=>{UI[id]=el.checked;render()}});
const fb=document.getElementById("fbeds");fb.value=UI.fbeds;fb.onchange=()=>{UI.fbeds=fb.value;render()};
document.getElementById("frst").onclick=()=>{Object.assign(UI,{f3000:true,fbeds:"",fpark:false,fwd:false,frated:false,q:""});q.value="";fb.value="";["f3000","fpark","fwd","frated"].forEach(id=>document.getElementById(id).checked=UI[id]);render()};
const ws=document.getElementById("whoSeg");const paintWho=()=>ws.querySelectorAll("button").forEach(b=>b.classList.toggle("on",b.dataset.p===UI.who));paintWho();ws.onclick=e=>{const b=e.target.closest("button");if(!b)return;UI.who=b.dataset.p;paintWho();render(true)};
document.getElementById("upd").textContent=UPDATED;
// map
const M=window.L.map("map",{zoomControl:true}).setView(UI.c||[42.345,-71.10],UI.z||13);
window.L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{attribution:'&copy; OpenStreetMap · 노선: MBTA',maxZoom:19,className:"tl"}).addTo(M);
function dec(s){let i=0,la=0,lo=0,o=[];while(i<s.length){let b,sh=0,r=0;do{b=s.charCodeAt(i++)-63;r|=(b&31)<<sh;sh+=5}while(b>=32);la+=r&1?~(r>>1):r>>1;sh=0;r=0;do{b=s.charCodeAt(i++)-63;r|=(b&31)<<sh;sh+=5}while(b>=32);lo+=r&1?~(r>>1):r>>1;o.push([la/1e5,lo/1e5])}return o}
const LC={Red:"#DA291C",Orange:"#ED8B00",Blue:"#003DA5","Green-B,Green-C,Green-D,Green-E":"#00843D",Mattapan:"#DA291C"};
Object.entries(SHAPES).forEach(([k,arr])=>arr.forEach(p=>window.L.polyline(dec(p),{color:LC[k],weight:3,opacity:.45,interactive:false}).addTo(M)));
window.L.marker(GEO.WORK,{icon:window.L.divIcon({html:'<div style="font-size:24px;line-height:24px;color:#7c3aed;text-shadow:0 0 3px #fff">★</div>',className:"",iconSize:[24,24],iconAnchor:[12,12]}),zIndexOffset:1000}).addTo(M).bindTooltip("직장 · Landmark Center",{permanent:true,direction:"right",offset:[10,0],className:"worklbl"});
const MK={};
function popHTML(r){const t=MSGS[r.n];const nx=(t&&t.next)||(r.pg&&r.pg.next);const o=NT[r.n]||{};
 return `<div class="pop"><div class="pt"><span class="stg k-${r.k}">${KL[r.k]}</span><b>${escH(r.n)}</b></div><div>${(()=>{const c=mo(r);return c?`생활비 ${fmt$(c.lo)}${c.hi>c.lo?"~"+Number(c.hi).toLocaleString():""}/월 (월세 ${fmt$(r.rent)})`:fmt$(r.rent)+"/월"})()} · ${escH(r.area||"")}</div>${chips(r)}${nx?`<div class="pn"><b style="font-size:11px;color:var(--mute)">다음</b> ${escH(nx)}</div>`:""}
 <div style="margin-top:6px">${stars1(r,"d")} ${stars1(r,"a")}</div>${["d","a"].filter(p=>o[p]).map(p=>`<div class="nt" style="margin-top:6px"><b>${PN[p]}</b>${escH(o[p])}</div>`).join("")}
 <div class="pa"><button class="act" data-pa="go">목록에서 보기${t?` · 대화 ${t.msgs.length}`:""}</button><button class="act" data-pa="memo">메모</button>${r.url?`<a class="act" href="${escH(r.url)}" target="_blank">매물 보기 ↗</a>`:""}</div><div class="pme"></div></div>`}
function paintMarker(r){const m=MK[r.n];if(!m)return;m.setStyle({fillColor:KC[r.k],radius:r.k==="x"?5:r.k==="n"?7:9,fillOpacity:r.k==="x"?.6:.95})}
L.forEach(r=>{if(!r.geo)return;const m=window.L.circleMarker(r.geo,{radius:8,color:"#fff",weight:2,fillColor:KC[r.k],fillOpacity:.95});MK[r.n]=m;paintMarker(r);
 m.bindTooltip(r.n,{direction:"top",offset:[0,-8]});m.bindPopup(()=>popHTML(r),{maxWidth:320});
 m.on("click",()=>{SEL=r.n;render(true);goCard(r.n)});});
M.on("popupopen",e=>{const el=e.popup.getElement();const n=e.popup._source&&Object.keys(MK).find(k=>MK[k]===e.popup._source);if(!n)return;
 el.onclick=ev=>{const s=ev.target.closest(".st");if(s){setStar(s.dataset.n,s.dataset.p,+s.dataset.v);e.popup.setContent(popHTML(L.find(x=>x.n===n)));render(true);return}
  const b=ev.target.closest("[data-pa]");if(!b)return;if(b.dataset.pa==="go"){SEL=n;const r=L.find(x=>x.n===n);if(r.k==="x"&&UI.tab==="go")UI.tab="x";render(true);goCard(n)}
  else if(b.dataset.pa==="memo"){const box=el.querySelector(".pme");const o=NT[n]||{};box.innerHTML=`<textarea class="nte" style="margin-top:6px">${escH(o[UI.who]||"")}</textarea><button class="act" data-pa="save" style="margin-top:4px">${PN[UI.who]} 메모 저장</button>`;box.querySelector("textarea").focus()}
  else if(b.dataset.pa==="save"){setNote(n,el.querySelector(".pme textarea").value);e.popup.setContent(popHTML(L.find(x=>x.n===n)));render(true)}}});
function goCard(n){const c=list.querySelector(`.card[data-n="${CSS.escape(n)}"]`);if(!c)return;c.scrollIntoView({behavior:"smooth",block:"nearest"});c.classList.remove("flash");void c.offsetWidth;c.classList.add("flash")}
let HL=null;function hl(n){if(HL===n)return;if(HL&&MK[HL]){const r=L.find(x=>x.n===HL);MK[HL].setStyle({color:"#fff",weight:2});paintMarker(r);MK[HL].closeTooltip()}HL=n;if(n&&MK[n]){MK[n].setStyle({color:"#111",weight:3,radius:13});MK[n].bringToFront();MK[n].openTooltip()}}
const UNI=window.L.layerGroup();Object.entries(UNIS).forEach(([n,g])=>{if(g)window.L.marker(g,{icon:window.L.divIcon({html:'<div style="font-size:16px;line-height:16px">🎓</div>',className:"",iconSize:[16,16],iconAnchor:[8,8]})}).bindTooltip(n,{direction:"top",className:"unilbl"}).addTo(UNI)});
const MUR=window.L.layerGroup();MURDERS.forEach(m=>{window.L.circle(m.g,{radius:804.67,color:"#dc2626",weight:1,opacity:.35,fillColor:"#dc2626",fillOpacity:.04,interactive:false}).addTo(MUR);window.L.marker(m.g,{icon:window.L.divIcon({html:'<div style="color:#b91c1c;font-weight:900;font-size:13px;line-height:13px;text-shadow:0 0 2px #fff">✖</div>',className:"",iconSize:[13,13],iconAnchor:[6,6]})}).bindTooltip(`${m.d||m.date||""} · ${m.a} (${m.nb})<br>${m.k}`).addTo(MUR)});
[["funi","uni",UNI],["fmur","mur",MUR]].forEach(([id,k,lay])=>{const el=document.getElementById(id);el.checked=UI[k];const ap=()=>{UI[k]=el.checked;el.checked?lay.addTo(M):lay.remove();saveUI()};el.onchange=ap;ap()});
M.on("moveend",()=>{UI.c=[M.getCenter().lat,M.getCenter().lng];UI.z=M.getZoom();saveUI()});
render();
</script></body></html>
