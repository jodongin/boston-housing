<html lang="ko"><head><meta charset="utf-8">
<title>보스턴 집 찾기</title>

<style>
:root{--bg:#f6f6f4;--card:#fff;--ink:#18191b;--ink2:#45484d;--mute:#83878d;--line:#e5e4df;--line2:#efeeea;--soft:#f2f2ef;
--bad:#c0281b;--warn:#a85d00;--ok:#1f7a4a;--accent:#18191b;--r:#7c3aed;--c:#2563eb;--n:#0f766e}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:14px/1.55 "Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
a{color:var(--ink2);text-decoration:underline;text-decoration-color:#c9c8c2;text-underline-offset:3px}a:hover{color:var(--ink);text-decoration-color:var(--ink)}
button{font:inherit;cursor:pointer;color:inherit}
h3,h4{margin:0}
.bad{color:var(--bad)}.q{color:var(--warn)}.mute{color:var(--mute);font-size:12.5px}
.dot{color:#c4c3bd;margin:0 6px}

.top{height:56px;display:flex;align-items:center;gap:22px;padding:0 20px;border-bottom:1px solid var(--line);background:#fff;position:relative;z-index:30}

.top .sp{flex:1}

.vtabs button:hover{color:var(--ink2)}
.vtabs button.on{color:var(--ink);border-bottom-color:var(--ink)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;padding:2px;background:var(--soft);gap:2px}
.seg button{border:0;background:none;padding:3px 11px;font-size:13px;color:var(--mute);border-radius:6px;font-weight:600;white-space:nowrap}
.seg button b{font-weight:600;margin-left:3px;font-variant-numeric:tabular-nums}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.who{font-size:12.5px;color:var(--mute);display:flex;align-items:center;gap:8px}
.lock{font-size:12.5px;color:var(--mute);text-decoration:none}
.upd{position:fixed;right:10px;bottom:4px;margin:0;font-size:10.5px;color:#b3b2ac;z-index:5;pointer-events:none}
/* layout */
.app{display:grid;grid-template-columns:minmax(500px,48%) 1fr;height:calc(100% - 56px)}
.side{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line)}

body[data-view="cmp"] .mapw,body[data-view="prog"] .mapw,body[data-view="cmp"] .mvt,body[data-view="prog"] .mvt{display:none}
body[data-view="prog"] .list{max-width:860px;margin:0 auto;width:100%}
.bar:empty{display:none}

.card .ph{display:block;width:calc(100% + 32px);margin:-14px -16px 12px;height:150px;object-fit:cover;border-radius:12px 12px 0 0}
.c1{display:flex;gap:14px;align-items:flex-start}
.hd{flex:1;min-width:0}
.nm{font-size:15.5px;font-weight:700;letter-spacing:-.3px;line-height:1.35}
.nm2{font-weight:500;color:var(--mute);font-size:12.5px;letter-spacing:0}
.base{display:inline-block;margin-left:6px;font-size:11px;font-weight:700;color:var(--ink2);border:1px solid #cfcec8;border-radius:4px;padding:0 5px;vertical-align:2px;letter-spacing:0}
.ar{color:var(--mute);font-size:12.5px;margin-top:2px}

.pr{text-align:right;white-space:nowrap;line-height:1.2;flex:none}

.pr>b{font-size:19px;font-weight:700;letter-spacing:-.4px;font-variant-numeric:tabular-nums}
.pr small{font-size:12px;color:var(--mute);margin-left:1px}
.pr .rt{display:block;font-size:12px;color:var(--mute);margin-top:4px}
.krw{position:relative;cursor:help}.krw:hover::after,.krw:focus::after{content:attr(data-k);position:absolute;right:0;top:125%;background:var(--ink);color:#fff;font-size:12px;font-weight:500;padding:4px 8px;border-radius:6px;white-space:nowrap;z-index:20;letter-spacing:0}
.cm{margin-top:10px;font-size:13.5px;color:var(--ink2)}

.sf{margin-top:4px;font-size:13px;color:var(--bad);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.c4{display:flex;align-items:center;gap:14px;margin-top:10px;padding-top:8px;border-top:1px solid var(--line2);font-size:12.5px;color:var(--mute)}
.sr{display:inline-flex;align-items:center;white-space:nowrap}
.sr .w{font-size:12px;margin-right:4px;color:var(--mute)}
.sr.me .w{color:var(--ink2);font-weight:600}
.st{color:#dddcd6;font-size:17px;line-height:1;padding:2px 1px;user-select:none;cursor:pointer}.st.on{color:#e8a10c}.st.a.on{color:#d9467a}.st:hover{color:#f1c25b}
@keyframes fl{0%{box-shadow:0 0 0 3px #fde68a}100%{box-shadow:0 0 0 0 transparent}}.card.flash{animation:fl 1.4s ease-out}
.empty{color:var(--mute);text-align:center;padding:48px 0}
.foot{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;color:var(--mute);font-size:12.5px;margin:18px 0 6px}
.foot .lnk{font-size:12.5px;color:var(--mute)}
/* detail panel */
.panel{margin-top:12px;border-top:1px solid var(--line);padding-top:4px;cursor:default}
.plinks{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;padding:8px 0 2px}
.ds{padding:12px 0 10px;border-bottom:1px solid var(--line2)}
.ds:last-child{border-bottom:0}

.kv{display:grid;grid-template-columns:88px 1fr;gap:6px 12px;font-size:13.5px;line-height:1.55}

.aq{border-left:3px solid var(--bad);padding:4px 0 4px 10px;margin:8px 0;font-size:13.5px}

.msgs{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.mg{border:1px solid var(--line);border-radius:10px;padding:8px 11px;background:#fff;white-space:pre-wrap;max-width:92%;font-size:13px;overflow-wrap:anywhere}

.cmp th,.cmp td{text-align:left;vertical-align:top;padding:10px 14px;border-bottom:1px solid var(--line2);min-width:220px;width:260px;max-width:300px}

.cmp tr:first-child th.rl{z-index:3}
.cmp .bc{background:#fafaf8}
.cmp tr:first-child th.bc{background:#fafaf8}
.cmp th{font-weight:400}
.cmp .cn{font-size:14px;font-weight:700;letter-spacing:-.3px;line-height:1.35}
.cmp .cst{margin:6px 0 4px;display:flex;flex-direction:column;gap:2px}
.cmp .big{font-size:17px;letter-spacing:-.3px;font-variant-numeric:tabular-nums}
.cmp .cm{margin:0}
/* progress */
.pi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin:10px 0}
.pih{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.pih .nm{font-size:15px}
.pst{font-size:12.5px;font-weight:600;color:var(--mute)}.pst.in{color:var(--r)}
.pn{display:grid;grid-template-columns:72px 1fr;gap:10px;font-size:13.5px;margin-top:6px;color:var(--ink2)}
.pn .k{color:var(--mute);font-size:12.5px}
.pa{display:flex;gap:16px;margin-top:8px}
.pconv{margin-top:8px;border-top:1px solid var(--line2);padding-top:6px}
.endg{margin-top:20px}
/* map */
.mapw{position:relative;min-height:0}
#map{position:absolute;inset:0;background:#eceae4}.tl{filter:saturate(.3) brightness(1.05) contrast(.95)}
.mtools{position:absolute;z-index:500;left:12px;bottom:14px;background:rgba(255,255,255,.95);border:1px solid var(--line);border-radius:10px;padding:6px 11px;font-size:12px;display:flex;gap:12px;flex-wrap:wrap;align-items:center;color:var(--ink2)}
.mtools i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}
.mtools .mlay{display:inline-flex;gap:10px;border-left:1px solid var(--line);padding-left:12px}
.mtools label{display:inline-flex;align-items:center;gap:3px}
.smk{color:#444;background:#fff;border:1.5px solid #555;font:700 9px/12px sans-serif;text-align:center;border-radius:4px;padding:0 3px;white-space:nowrap;opacity:1;display:inline-block;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.lowz .smk{width:7px;height:7px;padding:0;border-radius:50%;background:#fff;border:1.5px solid #555}.lowz .smk span{display:none}
.worklbl{font-size:12px;font-weight:700;padding:2px 7px;background:#fff;border:1px solid var(--r);color:#5b21b6;border-radius:5px}.worklbl:before{display:none}
.unilbl{font-size:11px;padding:1px 5px}.unilbl:before{display:none}
.leaflet-container{font-family:inherit}
.leaflet-popup-content-wrapper{border-radius:12px}
.leaflet-popup-content{margin:12px 14px;max-height:min(70vh,560px);overflow:auto}
.pop{font-size:13px;line-height:1.5;width:260px}
.pop .pt{font-size:14.5px;font-weight:700;letter-spacing:-.3px;line-height:1.35}
.pop .pa2{color:var(--mute);font-size:12.5px;margin-bottom:6px}
.pop .pr{text-align:left}.pop .pr>b{font-size:17px}
.pop .cm{margin-top:6px;font-size:13px}
.pop .c4{gap:10px;flex-wrap:wrap}
.pop .pa{display:flex;gap:14px;margin-top:8px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:9px 16px;border-radius:10px;font-size:13.5px;opacity:0;pointer-events:none;transition:all .2s;z-index:2000}
.toast.on{opacity:1;transform:translateX(-50%);pointer-events:auto}
.toast .lnk{color:#fff;text-decoration-color:#888;margin-left:8px}
.mvt{display:none}
@media (max-width:900px){
 .top{height:auto;flex-wrap:wrap;padding:10px 14px 0;gap:6px 10px;position:sticky;top:0}
 .top h1{font-size:15.5px}
 .who .lbl{display:none}
 .vtabs{order:5;width:100%;height:42px;margin:0 -14px;padding:0 4px;width:calc(100% + 28px);border-top:1px solid var(--line2)}
 .vtabs button{flex:1;padding:0 6px;font-size:14px}
 .app{display:block;height:auto}
 .side{border:0}
 .bar .row{padding:12px 12px 4px;flex-wrap:wrap}
 .bar .row{gap:8px}
 .bar #pickSeg{width:100%;display:flex}.bar #pickSeg button{flex:1;padding:5px 8px}
 .bar input[type=search]{width:auto;flex:1;min-width:100px}

 .kv{grid-template-columns:76px 1fr}
 .mapw{display:none;position:fixed;left:0;right:0;top:94px;bottom:0;z-index:20}
 body.mv-map .mapw{display:block}
 body.mv-map .side{display:none}
 .mtools{left:8px;right:8px;bottom:74px;font-size:11.5px}

</style></head><body>
